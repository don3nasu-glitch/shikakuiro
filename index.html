<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E63C9">
<title>国家資格 シカクイロ</title>
<style>
@font-face{font-family:"GreekSafe";src:local("Hiragino Maru Gothic ProN"),local("Hiragino Sans"),local("Segoe UI"),local("Arial");unicode-range:U+0370-03FF,U+2126;}
:root{
  --sakura:#8FB1FF; --momo:#2E63C9; --cream:#F2F7FF; --ink:#2F3B5C;
  --matcha:#3FB68B; --ichigo:#F1607A; --fuji:#8E7CC3; --card:0 2px 12px rgba(46,99,201,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:"GreekSafe","Hiragino Maru Gothic ProN","Yu Gothic UI","BIZ UDGothic",system-ui,sans-serif;
  color:#4A3B44;min-height:100vh;min-height:100dvh;
  background:radial-gradient(circle at 15% 8%,rgba(143,177,255,.14),transparent 32%),
             radial-gradient(circle at 88% 20%,rgba(142,124,195,.12),transparent 30%),#F4F8FF;
}
#app{max-width:430px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:20px;margin-bottom:4px}
.small{font-size:11px;color:rgba(47,59,92,.5)}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 2px 12px rgba(232,90,138,.12)}
.btn{display:block;width:100%;border:none;border-radius:999px;padding:14px;font-size:14px;font-weight:bold;
     font-family:inherit;cursor:pointer;text-align:center;color:#fff;background:#E85A8A;
     box-shadow:0 4px 0 0 rgba(46,99,201,.25);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:#E85A8A;border:2px solid #E85A8A;box-shadow:none}
.btn.green{background:#3FB68B;box-shadow:0 4px 0 0 rgba(63,182,139,.3)}
.btn.red{background:#fff;color:#F1607A;border:2px solid #F1607A;box-shadow:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.gap{display:flex;flex-direction:column;gap:14px}
/* ---------- 模試（試験会場のCBTモニターを再現） ---------- */
.cbt{background:#fff;border:1px solid #C9D2E0;border-radius:8px;overflow:hidden;
  font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;box-shadow:0 4px 16px rgba(32,69,110,.15)}
.cbt-head{background:#20456E;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;
  align-items:center;font-size:13px;font-weight:bold}
.cbt-head .tm{background:rgba(255,255,255,.15);border-radius:4px;padding:4px 10px;font-variant-numeric:tabular-nums}
.cbt-sub{background:#EEF2F7;border-bottom:1px solid #C9D2E0;padding:7px 14px;display:flex;
  justify-content:space-between;font-size:12.5px;color:#333;font-weight:bold}
.cbt-q{padding:14px;color:#111;font-size:14.5px;line-height:1.95}
.cbt .scenario{background:#F7F9FC;border-left:4px solid #20456E;border-radius:0;color:#111;font-weight:normal}
.cbt .qfigure{border-color:#C9D2E0}
.cbt .qsource{color:#8A99AC}
.cbt-choice{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:11px 12px;
  border:1px solid #C9D2E0;border-radius:4px;background:#fff;font-size:14px;line-height:1.7;color:#111;
  font-family:inherit;cursor:pointer;margin-top:8px}
.cbt-choice .rd{flex:0 0 18px;height:18px;margin-top:2px;border-radius:50%;border:2px solid #8A99AC;position:relative}
.cbt-choice.sel{background:#DCE9FA;border-color:#3B76C0}
.cbt-choice.sel .rd{border-color:#20456E}
.cbt-choice.sel .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#20456E}
.cbt-choice.okc{background:rgba(63,182,139,.12);border-color:#3FB68B}
.cbt-choice.ngc{background:rgba(241,96,122,.12);border-color:#F1607A}
.cbt-choice:disabled{cursor:default;opacity:1}
.cbt-flag{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid #C9D2E0;
  font-size:13px;color:#333;background:#FAFBFD;cursor:pointer;user-select:none}
.cbt-flag input{width:17px;height:17px;accent-color:#20456E}
.cbt-foot{display:flex;gap:8px;padding:10px;background:#EEF2F7;border-top:1px solid #C9D2E0}
.cbt-btn{flex:1;background:#fff;border:1px solid #8A99AC;border-radius:4px;padding:11px 8px;
  font-size:13px;color:#20456E;font-weight:bold;font-family:inherit;cursor:pointer}
.cbt-btn:disabled{opacity:.4;cursor:default}
.cbt-btn.end{background:#20456E;color:#fff;border-color:#20456E}
.qnav{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:10px 14px;background:#fff}
.qnav button{aspect-ratio:1;border-radius:4px;border:1px solid #C9D2E0;background:#fff;
  font-size:11px;font-weight:bold;color:#333;cursor:pointer;position:relative;padding:0;font-family:inherit}
.qnav button.ans{background:#DCE9FA;border-color:#3B76C0;color:#20456E}
.qnav button.cur{outline:2px solid #20456E;outline-offset:1px}
.qnav button.flg::after{content:"⚑";position:absolute;top:-6px;right:-2px;font-size:10px;color:#C77B00}
.qnav button.ok{background:rgba(63,182,139,.18);border-color:#3FB68B;color:#1E7A5A}
.qnav button.ng{background:rgba(241,96,122,.18);border-color:#F1607A;color:#B23A50}
.cbt-expl{margin:0 14px 14px;border:1px solid #C9D2E0;border-radius:4px;background:#F7F9FC;
  padding:12px;font-size:13.5px;line-height:1.9;color:#111}
.cbt-expl b{color:#20456E}
/* ---------- タイトル画面（アイドルステージ風） ---------- */
#idolsel{position:fixed;inset:0;z-index:85;display:none;flex-direction:column;align-items:center;
  justify-content:flex-start;gap:10px;padding:12px 18px 72px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;
  background:radial-gradient(130% 90% at 50% 0%,#3A1E5C 0%,#201347 55%,#0E0930 100%)}
#apptitle{position:fixed;inset:0;z-index:88;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:30px 24px;cursor:pointer;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#1A1650 0%,#0C0A2E 55%,#070619 100%);
  transition:opacity .5s ease,visibility .5s}
#apptitle.hide{opacity:0;visibility:hidden;pointer-events:none}
/* ミラーボール */
#apptitle .mirrorball{position:absolute;top:4.5%;left:50%;width:64px;height:64px;margin-left:-32px;border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,transparent 30%),
    repeating-conic-gradient(#DDE8F5 0 12deg,#9FB6D8 12deg 24deg,#F0F6FF 24deg 36deg);
  box-shadow:0 0 18px rgba(200,225,255,.8),0 0 44px rgba(150,200,255,.4);
  animation:ballSpin 6s linear infinite}
#apptitle .mirrorball::before{content:"";position:absolute;top:-12px;left:50%;width:2px;height:12px;margin-left:-1px;background:rgba(200,225,255,.7)}
@keyframes ballSpin{from{background-position:0 0,0 0}to{background-position:0 0,64px 0}}
/* ミラーボールの反射キラ */
#apptitle .fleck{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;
  background:rgba(220,240,255,.9);box-shadow:0 0 10px rgba(200,230,255,.9);
  animation:fleckTw 2.8s ease-in-out infinite}
@keyframes fleckTw{0%,100%{opacity:.1;transform:rotate(0) scale(.7)}50%{opacity:.95;transform:rotate(45deg) scale(1.15)}}
/* 左右に振れるスポットライト */
#apptitle .beam{position:absolute;top:-4%;width:150px;height:66%;pointer-events:none;opacity:.5;
  clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transform-origin:50% 0;
  animation:beamSway 4.6s ease-in-out infinite alternate}
#apptitle .beamL{left:6%;background:linear-gradient(rgba(64,229,255,.5),transparent 82%)}
#apptitle .beamR{right:6%;background:linear-gradient(rgba(255,64,214,.45),transparent 82%);animation-delay:1.1s;animation-direction:alternate-reverse}
@keyframes beamSway{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
/* ペンライトの海（観客のサイリウム） */
#apptitle .penlights{position:absolute;bottom:2.5%;left:50%;transform:translateX(-50%);width:96%;pointer-events:none}
#apptitle .penlights .row{display:flex;justify-content:center;gap:10px;align-items:flex-end}
#apptitle .penlights .row.back{opacity:.55;margin-bottom:-14px}
#apptitle .pl{display:block;width:5px;border-radius:3px;transform-origin:bottom center;
  animation:plSway 1.1s ease-in-out infinite alternate}
#apptitle .row.front .pl{height:34px}
#apptitle .row.back .pl{height:24px;animation-duration:1.35s}
#apptitle .pl.c1{background:linear-gradient(#BFF4FF,#40E5FF);box-shadow:0 0 9px rgba(64,229,255,.85)}
#apptitle .pl.c2{background:linear-gradient(#FFD3F1,#FF40D6);box-shadow:0 0 9px rgba(255,64,214,.85)}
#apptitle .pl.c3{background:linear-gradient(#FFF3C4,#FFD34D);box-shadow:0 0 9px rgba(255,211,77,.85)}
#apptitle .pl.c4{background:linear-gradient(#E3D4FF,#B08CFF);box-shadow:0 0 9px rgba(176,140,255,.85)}
@keyframes plSway{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
/* 跳ねるイコライザー */
#apptitle .eq{position:absolute;bottom:4.5%;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:flex-end;pointer-events:none}
#apptitle .eq i{display:block;width:6px;height:26px;border-radius:3px;transform-origin:bottom;animation:eqB .8s ease-in-out infinite alternate}
#apptitle .eq i:nth-child(3n+1){background:#40E5FF;box-shadow:0 0 8px rgba(64,229,255,.7)}
#apptitle .eq i:nth-child(3n+2){background:#FF40D6;box-shadow:0 0 8px rgba(255,64,214,.7);animation-delay:.15s}
#apptitle .eq i:nth-child(3n){background:#FFD34D;box-shadow:0 0 8px rgba(255,211,77,.7);animation-delay:.3s}
#apptitle .eq i:nth-child(2n){animation-duration:.65s}
@keyframes eqB{from{transform:scaleY(.25)}to{transform:scaleY(1.35)}}
/* 舞い上がる音符 */
#apptitle .noteup{position:absolute;bottom:8%;font-size:19px;pointer-events:none;opacity:0;
  animation:riseNote 6.5s linear infinite;text-shadow:0 0 10px currentColor}
@keyframes riseNote{0%{transform:translateY(0) rotate(-8deg);opacity:0}12%{opacity:.9}
  60%{opacity:.75}100%{transform:translateY(-64vh) rotate(10deg);opacity:0}}
/* ネオングリッドの床（動く） */
#apptitle .gridfloor{position:absolute;left:-60%;right:-60%;bottom:-14%;height:52%;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,rgba(64,229,255,.30) 0 2px,transparent 2px 72px),
    repeating-linear-gradient(0deg,rgba(64,229,255,.30) 0 2px,transparent 2px 46px);
  transform:perspective(430px) rotateX(63deg);
  -webkit-mask-image:linear-gradient(transparent,rgba(0,0,0,.9) 45%);
  mask-image:linear-gradient(transparent,rgba(0,0,0,.9) 45%);
  animation:gridmove 2.6s linear infinite}
@keyframes gridmove{from{background-position:0 0,0 0}to{background-position:0 0,0 46px}}
/* オーロラのグロー */
#apptitle .glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
#apptitle .glowA{width:340px;height:340px;background:rgba(64,229,255,.28);top:-90px;left:-110px}
#apptitle .glowB{width:380px;height:380px;background:rgba(255,64,214,.24);bottom:-60px;right:-120px}
/* 回転するホロリング（顔ぶれの後ろ） */
#apptitle .holoring{position:absolute;width:368px;height:368px;border-radius:50%;pointer-events:none;
  background:conic-gradient(transparent 0 40deg,rgba(64,229,255,.85) 90deg,rgba(255,64,214,.85) 160deg,transparent 210deg,rgba(64,229,255,.5) 300deg,transparent 340deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 2.5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 2.5px));
  animation:spin 7s linear infinite;filter:drop-shadow(0 0 10px rgba(64,229,255,.55))}
#apptitle .holoring.r2{width:436px;height:436px;animation-duration:12s;animation-direction:reverse;opacity:.5}
/* 浮遊パーティクル */
#apptitle .pdot{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;
  background:#40E5FF;box-shadow:0 0 8px #40E5FF;animation:pfloat 5.5s ease-in-out infinite}
#apptitle .pdot.m{background:#FF40D6;box-shadow:0 0 8px #FF40D6}
@keyframes pfloat{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(-26px);opacity:.95}}
#apptitle .crownlogo{position:relative;font-size:clamp(23px,7.4vw,34px);font-weight:900;letter-spacing:.14em;
  background:linear-gradient(100deg,#FF6FD8 0%,#FF9FB8 50%,#FFD34D 100%);-webkit-background-clip:text;
  background-clip:text;color:transparent;white-space:nowrap;
  filter:drop-shadow(0 0 14px rgba(255,111,216,.55)) drop-shadow(0 0 30px rgba(255,64,214,.3))}
#apptitle .crownlogo .mic{background:none;-webkit-background-clip:border-box;color:#FFD9EF;filter:none}
#apptitle .grouptag{position:relative;display:flex;align-items:center;gap:clamp(5px,1.6vw,8px);margin-bottom:8px}
#apptitle .grouptag b{width:clamp(38px,11vw,50px);height:clamp(38px,11vw,50px);border-radius:12px;display:grid;place-items:center;
  font-size:clamp(23px,6.8vw,31px);font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);
  background:linear-gradient(140deg,var(--c),var(--c2));
  box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 -3px 8px rgba(0,0,0,.2),0 0 20px var(--gl);
  animation:sqPop 2.6s ease-in-out infinite}
#apptitle .grouptag b:nth-child(odd){transform:rotate(-4deg)}
#apptitle .grouptag b:nth-child(even){transform:rotate(3deg);animation-delay:1.3s}
@keyframes sqPop{0%,100%{translate:0 0}50%{translate:0 -3px}}
#apptitle .applogo{position:relative;font-size:clamp(46px,14vw,64px);white-space:nowrap;font-weight:900;letter-spacing:.05em;line-height:1.2;
  background:linear-gradient(100deg,#7FE9FF 0%,#B08CFF 45%,#FF6FD8 100%);-webkit-background-clip:text;
  background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(127,233,255,.45)) drop-shadow(0 0 34px rgba(255,111,216,.3))}
#apptitle .catch{position:relative;color:rgba(255,255,255,.9);font-size:clamp(15px,4.8vw,20px);font-weight:900;letter-spacing:.34em;text-align:center;margin-top:2px;text-shadow:0 0 12px rgba(127,233,255,.5)}
#apptitle .lightrays{opacity:.55;background:conic-gradient(rgba(240,105,154,.10) 0 9deg,transparent 9deg 24deg,rgba(240,105,154,.10) 24deg 33deg,transparent 33deg 48deg,rgba(155,111,216,.10) 48deg 57deg,transparent 57deg 72deg,rgba(240,105,154,.10) 72deg 81deg,transparent 81deg 96deg,rgba(240,105,154,.10) 96deg 105deg,transparent 105deg 120deg,rgba(155,111,216,.10) 120deg 129deg,transparent 129deg 144deg,rgba(240,105,154,.10) 144deg 153deg,transparent 153deg 168deg,rgba(240,105,154,.10) 168deg 177deg,transparent 177deg 192deg,rgba(155,111,216,.10) 192deg 201deg,transparent 201deg 216deg,rgba(240,105,154,.10) 216deg 225deg,transparent 225deg 240deg,rgba(240,105,154,.10) 240deg 249deg,transparent 249deg 264deg,rgba(155,111,216,.10) 264deg 273deg,transparent 273deg 288deg,rgba(240,105,154,.10) 288deg 297deg,transparent 297deg 312deg,rgba(155,111,216,.10) 312deg 321deg,transparent 321deg 336deg,rgba(240,105,154,.10) 336deg 345deg,transparent 345deg 360deg)}
#apptitle .lineup{position:relative;display:flex;gap:clamp(16px,5vw,24px);margin:14px 0 10px;align-items:center;justify-content:center}
#apptitle .lineup .holoring{left:50%;top:50%;margin-left:-184px;margin-top:-184px}
#apptitle .lineup .holoring.r2{margin-left:-218px;margin-top:-218px}
#apptitle .lineup .fc{width:clamp(104px,29vw,126px);height:clamp(104px,29vw,126px);border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(160deg,#FFF0F6,#EFE9FF);box-shadow:0 0 0 2.5px rgba(127,233,255,.9),0 0 22px rgba(127,233,255,.45),0 10px 28px rgba(0,0,0,.5);
  animation:charBob 4.2s ease-in-out infinite}
#apptitle .lineup .fc img{width:100%;height:100%;object-fit:cover;object-position:top}
#apptitle .lineup .fc.em{font-size:46px}
#apptitle .lineup .fc:nth-child(2){animation-delay:.7s}
#apptitle .lineup .fc:nth-child(3){animation-delay:1.4s}
#apptitle .tstart{position:relative;margin-top:12px;font-size:18px !important;padding:18px 38px !important;white-space:nowrap;background:linear-gradient(100deg,#40E5FF,#B06CFF 55%,#FF40D6);
  color:#fff;font-size:16px;font-weight:900;border:none;border-radius:999px;padding:16px 46px;
  box-shadow:0 0 22px rgba(64,229,255,.5),0 0 40px rgba(255,64,214,.35),0 10px 26px rgba(0,0,0,.45);
  text-shadow:0 1px 4px rgba(0,0,0,.35);animation:tapPulse 1.8s ease-in-out infinite}
.flashfx{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 44%,rgba(255,255,255,.95),rgba(200,240,255,.55) 42%,transparent 78%);
  animation:flashPop .5s ease-out forwards}
@keyframes flashPop{0%{opacity:0}16%{opacity:.92}100%{opacity:0}}
#apptitle.opening{filter:brightness(1.22) saturate(1.12);transition:filter .18s}
#apptitle .applogo.kokka{font-size:clamp(42px,13vw,60px);letter-spacing:.14em;margin-bottom:6px}
#apptitle .grouptag.big{margin:2px 0 12px}
#apptitle .grouptag.big b{width:clamp(50px,14.5vw,66px);height:clamp(50px,14.5vw,66px);border-radius:15px;font-size:clamp(28px,8.6vw,38px)}
#apptitle .catch.long{letter-spacing:.16em}
#apptitle .tsub{position:relative;color:rgba(165,200,230,.9);font-size:clamp(12px,3.6vw,14.5px);font-weight:bold;letter-spacing:.1em}
.idolsel-rays{position:absolute;left:50%;top:42%;width:180vmax;height:180vmax;border-radius:50%;
  transform:translate(-50%,-50%);animation:raysSpin 90s linear infinite;opacity:.16;pointer-events:none;
  background:conic-gradient(#fff 0 9deg,transparent 9deg 24deg,#fff 24deg 33deg,transparent 33deg 48deg,
  #fff 48deg 57deg,transparent 57deg 72deg,#fff 72deg 81deg,transparent 81deg 96deg,#fff 96deg 105deg,
  transparent 105deg 120deg,#fff 120deg 129deg,transparent 129deg 144deg,#fff 144deg 153deg,transparent 153deg 168deg,
  #fff 168deg 177deg,transparent 177deg 192deg,#fff 192deg 201deg,transparent 201deg 216deg,#fff 216deg 225deg,
  transparent 225deg 240deg,#fff 240deg 249deg,transparent 249deg 264deg,#fff 264deg 273deg,transparent 273deg 288deg,
  #fff 288deg 297deg,transparent 297deg 312deg,#fff 312deg 321deg,transparent 321deg 336deg,#fff 336deg 345deg,transparent 345deg 360deg)}
.idolsel-spark{position:absolute;font-size:18px;opacity:.8;animation:sparkTw 3.4s ease-in-out infinite;pointer-events:none}
/* 選択画面のステージ演出（ミラーボール・ビーム・ペンライト） */
#idolsel .isel-ball{position:absolute;top:10px;left:50%;width:46px;height:46px;margin-left:-23px;border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,transparent 30%),
    repeating-conic-gradient(#DDE8F5 0 12deg,#9FB6D8 12deg 24deg,#F0F6FF 24deg 36deg);
  box-shadow:0 0 18px rgba(200,225,255,.8),0 0 44px rgba(150,200,255,.4);
  animation:ballSpin 6s linear infinite}
#idolsel .isel-ball::before{content:"";position:absolute;top:-14px;left:50%;width:2px;height:14px;margin-left:-1px;background:rgba(200,225,255,.7)}
#idolsel .isel-fleck{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;
  background:rgba(220,240,255,.9);box-shadow:0 0 10px rgba(200,230,255,.9);
  animation:fleckTw 2.8s ease-in-out infinite}
#idolsel .isel-beam{position:absolute;top:-10%;height:72vh;width:36vw;pointer-events:none;opacity:.4;filter:blur(5px);
  clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);transform-origin:top center;animation:iselSway 5.5s ease-in-out infinite alternate}
#idolsel .isel-beam.bl{left:2%;background:linear-gradient(180deg,rgba(255,111,216,.55),transparent 78%)}
#idolsel .isel-beam.br{right:2%;background:linear-gradient(180deg,rgba(64,229,255,.5),transparent 78%);animation-delay:1.4s}
@keyframes iselSway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
/* 装飾はスクロール範囲に影響させない（アイドル選択に必要な分だけ上下に動く） */
#idolsel .idolsel-rays,#idolsel .idolsel-spark,#idolsel .isel-ball,#idolsel .isel-beam,#idolsel .isel-pl,#idolsel .isel-fleck,#idolsel .fallfx{position:fixed}
#idolsel .isel-pl{position:absolute;bottom:1.8%;left:50%;transform:translateX(-50%);display:flex;gap:9px;align-items:flex-end;pointer-events:none}
#idolsel .isel-pl i{display:block;width:5px;height:30px;border-radius:3px;transform-origin:bottom center;animation:plSway 1.2s ease-in-out infinite alternate}
#idolsel .isel-pl i.c1{background:linear-gradient(#BFF4FF,#40E5FF);box-shadow:0 0 9px rgba(64,229,255,.85)}
#idolsel .isel-pl i.c2{background:linear-gradient(#FFD3F1,#FF40D6);box-shadow:0 0 9px rgba(255,64,214,.85)}

.bday-card{border-radius:20px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#FF6FD8,#FFD34D 50%,#40E5FF);box-shadow:0 8px 24px rgba(232,68,127,.35);position:relative;overflow:hidden}

.oshi-row img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--c)}
.fccard{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,var(--c,#E85A8A) 0%,#2A2440 70%,#0F1424 100%);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.fccard:before{content:"";position:absolute;inset:-40% -20%;background:conic-gradient(from 200deg,rgba(255,255,255,0) 0 20%,rgba(255,255,255,.22) 28%,rgba(255,255,255,0) 36% 60%,rgba(255,255,255,.14) 68%,rgba(255,255,255,0) 76%);pointer-events:none}
.fccard .lbl{font-size:9px;letter-spacing:.2em;font-weight:900;opacity:.75}
.fccard .no{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:.18em;font-weight:900}
/* コレクション: 資格バッジ */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{position:relative;border-radius:18px;padding:12px 6px 10px;text-align:center;background:#fff;border:2px solid #E6E9F2;cursor:pointer;transition:transform .15s}
.badge:active{transform:scale(.96)}
.badge .ic{font-size:30px;display:block;line-height:1.2}
.badge .nm{font-size:10.5px;font-weight:bold;line-height:1.35;display:block;margin-top:5px;color:#2F3B5C;min-height:2.7em}
.badge .st{font-size:9.5px;font-weight:900;display:block;margin-top:4px;letter-spacing:.04em;color:#8B96AF}
.badge.none{opacity:.55}
.badge.started{border-color:#C9885A;background:linear-gradient(180deg,#fff,#FBF0E6)} .badge.started .st{color:#B0673A}
.badge.mock{border-color:#9AA6B8;background:linear-gradient(180deg,#fff,#EEF2F8)} .badge.mock .st{color:#5D6B8C}
.badge.passed{border-color:#E0B23C;background:linear-gradient(180deg,#FFFBEA,#FFF0B8);box-shadow:0 6px 18px rgba(224,178,60,.35)} .badge.passed .st{color:#9C6A0A}
.badge.passed:after{content:"✓";position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:#E0B23C;color:#fff;font-size:13px;font-weight:900;line-height:22px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.compbar{height:8px;border-radius:999px;background:#EEF1F8;overflow:hidden;margin-top:6px}
.compbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFB6CC,#E85A8A)}
/* 合格達成証 */
.certcard{position:relative;border-radius:16px;padding:22px 20px 18px;background:linear-gradient(160deg,#FFFDF6,#FFF6DC);border:2px solid #E0B23C;box-shadow:0 12px 32px rgba(224,178,60,.25);color:#3B2F0A;overflow:hidden}
.certcard:before{content:"";position:absolute;inset:7px;border:1px solid rgba(224,178,60,.6);border-radius:11px;pointer-events:none}
.certcard .seal{position:absolute;right:16px;top:14px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE28A,#D89A12 70%);box-shadow:0 4px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:26px}
.certcard .eyebrow{font-size:9px;letter-spacing:.28em;font-weight:900;color:#9C6A0A}
.certcard h2{font-family:inherit;font-size:22px;font-weight:900;margin:4px 0 0;letter-spacing:.06em;color:#3B2F0A}
.certcard .exam{font-size:16px;font-weight:900;margin-top:14px;line-height:1.5;color:#2F3B5C}
.certcard .row{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px}
.certcard .lbl{font-size:9px;letter-spacing:.2em;font-weight:900;color:#9C6A0A}
.certcard .v{font-size:14px;font-weight:bold;color:#2F3B5C}
.certcard .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.14em;font-weight:900}
.certcard .idol{display:flex;gap:12px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(224,178,60,.6)}
.certcard .idol img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #E0B23C;background:#fff}
.certcard .idol p{font-size:12px;line-height:1.6;color:#3B2F0A}
.certcard .note{font-size:9.5px;color:#8B7A4A;margin-top:12px;line-height:1.5}
.fccard .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px}
.fccard .v{font-size:14px;font-weight:900}
.titlechip{display:inline-block;font-size:11px;font-weight:900;border-radius:999px;padding:5px 10px;margin:3px 4px 0 0;background:rgba(255,255,255,.9);color:#2F3B5C}
.titlechip.off{background:rgba(255,255,255,.18);color:rgba(255,255,255,.55)}
/* 高さの低い端末では選択画面をひとまわり圧縮して必ず1画面に収める */
@media (max-height:640px){
  #idolsel{gap:8px;padding:10px 16px 40px}
  #idolsel h2{margin-top:42px;font-size:19px}
  #idolsel .isel-ball{width:36px;height:36px;margin-left:-18px}
  #idolsel .idol-card{padding:9px 12px;gap:10px;border-radius:20px}
  #idolsel .idol-card img,#idolsel .idol-card .emoji{width:60px;height:60px}

  #idolsel .isel-pl{display:none}
}
@keyframes zoomSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
/* メンバーカラーの降りハーツ（タイトル・選択画面） */
.fallfx{position:absolute;top:-6%;font-size:15px;opacity:0;pointer-events:none;animation:fallDown linear infinite}
@keyframes fallDown{0%{transform:translateY(0) rotate(0);opacity:0}8%{opacity:.9}85%{opacity:.7}100%{transform:translateY(112vh) rotate(300deg);opacity:0}}
/* アイドルカードの登場アニメと推し色の鼓動 */
#idolsel .idol-card{animation:cardIn .55s cubic-bezier(.2,.8,.3,1.25) both}
#idolsel .idol-card:nth-of-type(2){animation-delay:.08s}
#idolsel .idol-card:nth-of-type(3){animation-delay:.16s}
#idolsel .idol-card:nth-of-type(4){animation-delay:.24s}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
#idolsel .idol-card::before{animation:glowPulse 2.4s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.72}50%{opacity:1}}
/* 再生画面のランダム・ループボタン */
.pl-mode{width:44px;height:44px;border-radius:50%;border:2px solid rgba(47,59,92,.18);background:#fff;font-size:17px;cursor:pointer;color:rgba(47,59,92,.4)}

/* ミニプレイヤー（Voicy/Audible式・ナビの上に常駐） */
#miniplayer{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:60;display:none;align-items:center;gap:10px;
  background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px 8px 8px;

  background:conic-gradient(from 40deg,#FF8FB1,#8E7CC3,#8FB1FF,#FF8FB1);animation:mpSpin 7s linear infinite}

@keyframes mpSpin{to{transform:rotate(360deg)}}

/* 4人体制のタイトル画面: 円をひとまわり詰めて1列に収める */
#apptitle .lineup.n4{gap:clamp(8px,2.6vw,14px)}
#apptitle .lineup.n4 .fc{width:clamp(62px,18.5vw,84px);height:clamp(62px,18.5vw,84px)}
.renahero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px;color:#fff;
  background:linear-gradient(135deg,#2E2A4A 0%,#4A3B12 60%,#8A6A10 100%);box-shadow:0 8px 26px rgba(74,59,18,.35)}
.renahero .em{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;font-size:40px;
  background:linear-gradient(135deg,#FFD34D,#F5A623);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.dojohero-shia{background:linear-gradient(135deg,#3A1F3F 0%,#6E2748 60%,#A93A67 100%);box-shadow:0 8px 26px rgba(110,39,72,.35)}
.tostart{position:absolute;top:0;right:0;display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.85);border:1.5px solid rgba(232,90,138,.35);color:#E85A8A;
  border-radius:999px;padding:7px 12px;font-size:11px;font-weight:900;cursor:pointer;
  box-shadow:0 2px 8px rgba(232,90,138,.15)}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.4;z-index:-1;pointer-events:none}
.blob.b1{width:300px;height:300px;background:#FFD1E0;top:-80px;right:-90px;animation:drift 22s ease-in-out infinite}
.blob.b2{width:340px;height:340px;background:#D9D2F5;bottom:-120px;left:-110px;animation:drift 26s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,18px) scale(1.08)}}
.lvbar>i{background-size:200% 100%;animation:lvflow 3.5s linear infinite}
@keyframes lvflow{0%{background-position:0% 0}100%{background-position:200% 0}}
.streak{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#FFEDD5,#FFD1E0);
  border-radius:999px;padding:3px 10px;font-size:11px;font-weight:bold;color:#E85A8A}
.pl-disc{width:150px;height:150px;border-radius:50%;margin:2px auto 10px;display:grid;place-items:center;position:relative;
  background:conic-gradient(from 40deg,#FF8FB1,#8E7CC3,#8FB1FF,#FF8FB1);box-shadow:0 10px 28px rgba(142,124,195,.35);
  animation:spin 14s linear infinite;animation-play-state:paused}
body.playing .pl-disc{animation-play-state:running}
.pl-disc b{position:relative;z-index:1;font-size:26px;color:#E85A8A}
.pl-disc::after{content:"";position:absolute;width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.4),inset 0 0 0 2px rgba(232,90,138,.18)}
@keyframes spin{to{transform:rotate(360deg)}}
.songbanner{position:relative;overflow:hidden;margin-top:16px;cursor:pointer;display:flex;align-items:center;gap:14px;
  background:linear-gradient(120deg,#FF8FB1,#B487FF 55%,#8FB1FF);border-radius:26px;padding:18px 18px;
  box-shadow:0 10px 30px rgba(180,135,255,.45)}
.songbanner .eyebrow{display:block;font-style:normal;font-size:9.5px;font-weight:900;letter-spacing:.14em;
  color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(47,59,92,.3);margin-bottom:4px}
.songbanner::after{content:"";position:absolute;top:0;bottom:0;width:46%;left:-60%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);
  animation:bannershine 3.8s ease-in-out infinite}
@keyframes bannershine{0%,55%{left:-60%}90%,100%{left:130%}}
.songbanner .disc{flex:0 0 62px;height:62px;border-radius:50%;position:relative;
  background:conic-gradient(from 40deg,#FF8FB1,#8E7CC3,#8FB1FF,#FF8FB1);
  box-shadow:0 3px 10px rgba(47,59,92,.25);display:grid;place-items:center;animation:spin 9s linear infinite}
.songbanner .disc::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff}
.songbanner .disc b{position:relative;z-index:1;font-size:19px;color:#fff;text-shadow:0 1px 3px rgba(47,59,92,.4)}
.songbanner .listen{flex:0 0 auto;background:#fff;color:#E85A8A;border-radius:999px;padding:12px 19px;
  font-size:14px;font-weight:900;box-shadow:0 4px 12px rgba(47,59,92,.22)}
.certbadge{display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:.03em;border-radius:6px;
  padding:2px 7px;margin-left:6px;vertical-align:1.5px;background:rgba(142,124,195,.14);color:#7A68B0;white-space:nowrap}
body.dojo-rena .certbadge{background:rgba(232,162,11,.16);color:#A8730B}
body.dojo-sena .certbadge{background:rgba(226,59,46,.14);color:#C2392C}
body.dojo-towa .certbadge{background:rgba(232,182,42,.20);color:#7A5A00}
.songsec{display:flex;align-items:center;gap:10px;margin:14px 2px 0;font-size:13px;font-weight:bold;color:#8E7CC3}
.songsec .certbadge{margin-left:2px;order:2}
.songsec::after{content:"";flex:1;height:2px;order:3;border-radius:2px;background:linear-gradient(90deg,rgba(142,124,195,.35),transparent)}
.scenario{background:#FAFBFF;border-left:4px solid #8E7CC3;border-radius:0 12px 12px 0;padding:12px 14px;
  font-size:13px;line-height:1.9;color:#2F3B5C;white-space:pre-wrap;margin-bottom:10px}
#appdlg{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(30,34,60,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#appdlg.show{display:flex}
#appdlg .dlg{width:100%;max-width:340px;background:#fff;border-radius:20px;padding:20px 18px 16px;box-shadow:0 18px 50px rgba(47,59,92,.35);animation:dlgin .18s ease-out}
@keyframes dlgin{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
#appdlg .dlg-title{font-size:15px;font-weight:900;color:#2F3B5C;margin-bottom:8px}
#appdlg .dlg-msg{font-size:14px;line-height:1.8;color:#2F3B5C;white-space:pre-wrap;word-break:break-word}
#appdlg input{width:100%;box-sizing:border-box;margin-top:12px;padding:12px 14px;font-size:16px;font-family:inherit;border:2px solid rgba(142,124,195,.35);border-radius:12px;outline:none;background:#FAFBFF}
#appdlg input:focus{border-color:#8E7CC3}
#appdlg .dlg-btns{display:flex;gap:10px;margin-top:16px}
#appdlg .dlg-btns button{flex:1;padding:13px 10px;font-size:14px;font-weight:900;font-family:inherit;border:none;border-radius:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#appdlg .dlg-ok{color:#fff;background:linear-gradient(100deg,#8E7CC3,#B06CFF);box-shadow:0 6px 16px rgba(142,124,195,.35)}
#appdlg .dlg-ok.danger{background:linear-gradient(100deg,#E85A8A,#B23A50);box-shadow:0 6px 16px rgba(178,58,80,.3)}
#appdlg .dlg-cancel{color:#2F3B5C;background:#EEF2FF}
.qfigure{position:relative;cursor:zoom-in;overflow-x:auto;background:#fff;border:1px solid rgba(142,124,195,.25);border-radius:12px;
  padding:10px;margin-bottom:10px;text-align:center}
.qfigure svg{max-width:100%;height:auto}
.figzoom-hint{position:absolute;right:8px;top:8px;background:rgba(142,124,195,.9);color:#fff;
  border-radius:999px;padding:3px 10px;font-size:11px;font-weight:bold;pointer-events:none}
#figview{position:fixed;inset:0;z-index:90;display:none;background:rgba(47,59,92,.92);
  overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;overscroll-behavior:contain}
#figview.show{display:block}
#figview .figwrap{min-height:100%;display:block;width:max-content;min-width:100%;padding:64px 12px 24px;box-sizing:border-box}
#figview .figinner{background:#fff;border-radius:14px;padding:12px;display:inline-block}
#figview .fighint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-size:12px;font-weight:bold;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.5)}
#figview svg{max-width:none;height:auto;display:block}
#figview-close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:91;
  background:#fff;color:#E85A8A;border:none;border-radius:999px;padding:10px 18px;font-size:14px;
  font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
#figview-zoom{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;z-index:91;display:flex;gap:8px}
#figview-zoom button{background:#fff;color:#8E7CC3;border:none;border-radius:999px;width:44px;height:44px;
  font-size:20px;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.qsource{font-size:10px;color:rgba(47,59,92,.5);text-align:right;margin-top:8px}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:bold}
.tag.pink{background:rgba(143,177,255,.15);color:#E85A8A}
.tag.green{background:rgba(63,182,139,.15);color:#3FB68B}
.tag.purple{background:rgba(142,124,195,.15);color:#8E7CC3}
.tag.red{background:rgba(241,96,122,.15);color:#F1607A}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid #fff;
        background:#fff;border-radius:18px;padding:14px;font-size:14px;font-weight:bold;font-family:inherit;
        cursor:pointer;box-shadow:0 2px 12px rgba(232,90,138,.12);color:#4A3B44}
.choice .mark{flex:0 0 28px;height:28px;border-radius:50%;background:#FFF7F9;color:#E85A8A;
              display:grid;place-items:center;font-size:12px}
.choice.correct{border-color:#3FB68B;background:rgba(63,182,139,.08);color:#3FB68B}
.choice.wrong{border-color:#F1607A;background:rgba(241,96,122,.08);color:#F1607A}
.choice.dim{color:rgba(47,59,92,.35)}
.bubblewrap{display:flex;align-items:flex-start;gap:8px}
.bubble{position:relative;flex:1;margin-top:8px;background:#fff;border:2px solid rgba(143,177,255,.6);
        border-radius:18px;border-top-left-radius:4px;padding:12px;font-size:13px;line-height:1.7;box-shadow:0 2px 12px rgba(232,90,138,.12)}
.bubble::before{content:"";position:absolute;left:-8px;top:12px;width:12px;height:12px;background:#fff;
        border-left:2px solid rgba(143,177,255,.6);border-bottom:2px solid rgba(143,177,255,.6);transform:rotate(45deg)}
.progressbar{height:10px;background:#fff;border-radius:999px;overflow:hidden;flex:1}
.progressbar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FF8FB1,#E85A8A);transition:width .3s}
.judge{text-align:center;font-size:24px;font-weight:bold}
.judge.ok{color:#3FB68B}.judge.ng{color:#F1607A}
.shiapop{filter:drop-shadow(0 6px 10px rgba(232,90,138,.25))}
.shia-idle{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
.shia-happy{animation:jump .9s ease-out,floaty 3s ease-in-out .9s infinite}
@keyframes jump{0%{transform:scale(.3) translateY(30px);opacity:0}45%{transform:scale(1.06) translateY(-16px)}65%{transform:translateY(5px)}82%{transform:translateY(-4px)}100%{transform:scale(1) translateY(0)}}
.shia-sad{animation:sway 1s ease-out,floaty 3.6s ease-in-out 1s infinite}
@keyframes sway{0%{transform:scale(.3);opacity:0}40%{transform:scale(1) rotate(0)}58%{transform:rotate(-6deg)}76%{transform:rotate(5deg)}100%{transform:rotate(0)}}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);
    border-top:1px solid rgba(143,177,255,.3);z-index:50}
nav .inner{max-width:430px;margin:0 auto;display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;font-family:inherit;padding:9px 0 7px;font-size:11px;font-weight:bold;
    color:rgba(47,59,92,.5);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:#E85A8A}
nav button .ic{font-size:18px;line-height:1}
nav button.songtab{color:#E85A8A}
nav button.songtab .ic{width:36px;height:36px;margin-top:-9px;border-radius:999px;display:grid;place-items:center;
  color:#fff;background:linear-gradient(135deg,#FF8FB1,#E85A8A);box-shadow:0 4px 12px rgba(232,90,138,.4)}
body.dojo-rena nav button.songtab{color:#E8791A}
body.dojo-rena nav button.songtab .ic{background:linear-gradient(135deg,#FFD34D,#F5A623);box-shadow:0 4px 12px rgba(245,166,35,.45)}
body.dojo-sena nav button.songtab{color:#D6452E}
body.dojo-sena nav button.songtab .ic{background:linear-gradient(135deg,#FF7A59,#E23B2E);box-shadow:0 4px 12px rgba(226,59,46,.45)}
body.dojo-towa nav button.songtab{color:#8A6400}
body.dojo-towa nav button.songtab .ic{background:linear-gradient(135deg,#FFD34D,#E8B62A);box-shadow:0 4px 12px rgba(232,182,42,.5)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu a{display:flex;flex-direction:column;gap:4px;background:#fff;border-radius:22px;padding:14px;
        box-shadow:0 2px 12px rgba(232,90,138,.12);text-decoration:none;color:#4A3B44}
.menu a:active{transform:scale(.97)}
.menu .ic{font-size:22px}.menu .t{font-size:13px;font-weight:bold}.menu .d{font-size:10px;color:rgba(47,59,92,.5);line-height:1.4}
input.search{width:100%;border:2px solid rgba(143,177,255,.4);border-radius:999px;padding:12px 16px;
        font-size:14px;font-family:inherit;outline:none;background:#fff}
input.search:focus{border-color:#E85A8A}
.flip{min-height:220px;width:100%;display:grid;place-items:center;text-align:center;border-radius:24px;
      border:2px solid rgba(143,177,255,.5);background:#fff;box-shadow:0 2px 12px rgba(232,90,138,.12);cursor:pointer;
      font-family:inherit;color:#4A3B44;padding:22px}
.flip.back{border-color:rgba(142,124,195,.5);background:rgba(142,124,195,.05)}
.lvbar{height:12px;border-radius:999px;background:rgba(232,90,138,.12);overflow:hidden;margin-top:10px}
.lvbar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FF8FB1,#8E7CC3);transition:width .4s}
.lvnum{font-size:34px;font-weight:bold;color:#E85A8A;line-height:1}
#lvup{position:fixed;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));z-index:70;display:none;
  border-radius:20px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#FF8FB1,#8E7CC3);
  box-shadow:0 8px 24px rgba(142,124,195,.4);text-align:center}
#lvup.show{display:block;animation:lvupIn 2.8s ease-out forwards}
#lvup b{display:block;font-size:19px;margin-bottom:2px}
@keyframes lvupIn{0%{opacity:0;transform:translateY(-24px) scale(.9)}
  12%{opacity:1;transform:translateY(0) scale(1)}85%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-12px)}}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-top:14px}
.stat3>div{background:#FFF7F9;border-radius:16px;padding:10px}
.stat3 b{font-size:18px}
.bar{height:9px;background:#FFF7F9;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#FF8FB1,#8E7CC3);border-radius:999px}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
hr{border:none;border-top:1px solid rgba(143,177,255,.2);margin:12px 0}
a.link{color:#E85A8A;font-weight:bold;text-decoration:none}
/* ---------- 正解時のシアちゃんポップイン演出 ---------- */
#praise-pop{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:60;
  display:none;justify-content:center;align-items:flex-end;gap:12px;padding:0 16px;pointer-events:none}
#praise-pop.show{display:flex;animation:praisePop 1.9s ease-out forwards}
@keyframes praisePop{
  0%{opacity:0;transform:translateY(24%)}
  10%{opacity:1;transform:translateY(0)}
  80%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(12%)}
}
.praise-stage{position:relative;flex:0 0 auto}
/* 背後にふわっと広がる光 */
.pr-glow{position:absolute;left:50%;top:50%;width:150px;height:150px;border-radius:50%;z-index:0;
  background:radial-gradient(circle,rgba(255,160,193,.8),rgba(143,177,255,.35) 55%,transparent 72%)}
#praise-pop.show .pr-glow{animation:prGlow 1.4s ease-out both}
@keyframes prGlow{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
  30%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.3);opacity:0}
}
/* 波紋のように広がるリング */
.pr-ring{position:absolute;left:50%;top:50%;width:92px;height:92px;border-radius:50%;z-index:0;
  border:3px solid rgba(232,90,138,.45)}
#praise-pop.show .pr-ring{animation:prRing .75s ease-out .06s both}
@keyframes prRing{
  0%{transform:translate(-50%,-50%) scale(.35);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.75);opacity:0}
}
/* きらきらパーティクル */
.pr-spark{position:absolute;left:50%;top:45%;z-index:2;font-size:19px;line-height:1;color:var(--c,#FF8FB1);
  text-shadow:0 1px 0 rgba(255,255,255,.9),0 0 8px rgba(255,255,255,.9);
  filter:drop-shadow(0 2px 3px rgba(46,99,201,.25));opacity:0}
#praise-pop.show .pr-spark{animation:prSpark .9s ease-out var(--d,.1s) both}
@keyframes prSpark{
  0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:0}
  18%{opacity:1}
  60%{opacity:1}
  100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1.05) rotate(var(--r,40deg));opacity:0}
}
.pr-spark.s1{--tx:-54px;--ty:-48px;--c:#FF8FB1;--d:.08s;--r:-40deg}
.pr-spark.s2{--tx:52px;--ty:-56px;--c:#8FB1FF;--d:.12s;--r:50deg;font-size:22px}
.pr-spark.s3{--tx:-66px;--ty:4px;--c:#F5C542;--d:.16s;--r:-70deg;font-size:16px}
.pr-spark.s4{--tx:64px;--ty:-4px;--c:#E85A8A;--d:.2s;--r:60deg}
.pr-spark.s5{--tx:-30px;--ty:-68px;--c:#8E7CC3;--d:.24s;--r:-25deg;font-size:17px}
.pr-spark.s6{--tx:30px;--ty:-72px;--c:#3FB68B;--d:.28s;--r:35deg;font-size:18px}
/* グラデーションリングの顔アバター */
.pr-frame{position:relative;z-index:1;padding:3px;border-radius:30px;
  background:linear-gradient(140deg,#FFB7CD,#FF8FB1 35%,#8FB1FF);
  box-shadow:0 10px 24px rgba(46,99,201,.3)}
#praise-pop.show .pr-frame{animation:prFace .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes prFace{
  0%{transform:translateY(60%) scale(.4) rotate(-10deg);opacity:0}
  55%{transform:translateY(-6%) scale(1.07) rotate(2deg);opacity:1}
  75%{transform:translateY(2%) scale(.98) rotate(-1deg)}
  100%{transform:translateY(0) scale(1) rotate(0)}
}
.praise-face{width:100px;height:118px;border-radius:27px;border:2.5px solid #fff;
  background:#EAF2FF url("assets/sia_praise.png") no-repeat;
  background-size:220% auto;background-position:54% 5%}
/* 吹き出し（顔のあとにポン、と出る） */
.praise-bubble{position:relative;max-width:240px;align-self:center;transform-origin:left bottom;
  background:linear-gradient(180deg,#fff,#FFF5F8);border:2px solid #FFA9C1;
  border-radius:18px;border-bottom-left-radius:4px;padding:10px 15px;font-size:15px;font-weight:bold;
  color:#E85A8A;line-height:1.6;letter-spacing:.02em;box-shadow:0 8px 20px rgba(232,90,138,.25)}
.praise-bubble::before{content:"";position:absolute;left:-8px;bottom:14px;width:12px;height:12px;background:#fff;
  border-left:2px solid #FFA9C1;border-bottom:2px solid #FFA9C1;transform:rotate(45deg)}
#praise-pop.show .praise-bubble{animation:prBubble .5s cubic-bezier(.34,1.56,.64,1) .14s both}
@keyframes prBubble{
  0%{transform:scale(.5);opacity:0}
  60%{transform:scale(1.06);opacity:1}
  100%{transform:scale(1);opacity:1}
}
/* 覚え歌 */
.songrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;
  box-shadow:0 2px 12px rgba(232,90,138,.12);cursor:pointer}
.songnum{flex:0 0 36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#FF8FB1,#8FB1FF);
  color:#fff;font-weight:bold;display:grid;place-items:center;font-size:14px}
.songstate{flex:0 0 auto;font-size:12px;font-weight:bold}
.lyr-h{font-size:11px;font-weight:bold;color:#8E7CC3;background:rgba(142,124,195,.12);border-radius:999px;
  display:inline-block;padding:3px 12px;margin:18px 0 8px}
.lyr-line{font-size:15px;font-weight:bold;line-height:1.9;color:#2F3B5C}
.lyr-line b{color:#E85A8A}

.lyrics.synced .lyr-line{cursor:pointer;opacity:.42;transition:opacity .25s,color .25s,transform .25s;transform-origin:left center}
.lyrics.synced .lyr-line.done{opacity:.6}

  box-shadow:0 8px 20px rgba(232,90,138,.4);display:grid;place-items:center;padding:0;transition:transform .1s}
.pl-play:active{transform:scale(.94)}
.pl-skip{width:56px;height:56px;border-radius:50%;border:2px solid rgba(232,90,138,.35);background:#fff;

.pl-skip:disabled{opacity:.3}
.pl-seek{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;

.pl-seek::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;

.pl-time{display:flex;justify-content:space-between;font-size:11px;font-weight:bold;color:rgba(47,59,92,.55)}
.ratechip{border:none;background:#fff;color:#E85A8A;font-weight:bold;font-family:inherit;

.ratechip.on{background:#E85A8A;color:#fff}
/* 設定のトグルスイッチ */
.switch{position:relative;width:52px;height:30px;border-radius:999px;border:none;background:#D9D2D6;
  cursor:pointer;flex:0 0 auto;transition:background .2s;padding:0}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;

.switch.on{background:#3FB68B}
.switch.on i{left:25px}
/* 模試の制限時間タイマー */
.examtimer{flex:0 0 auto;font-weight:bold;font-size:12px;color:#2E63C9;background:rgba(143,177,255,.15);border-radius:999px;padding:4px 10px}
.examtimer.warn{color:#F1607A;background:rgba(241,96,122,.12);animation:timerPulse 1s ease-in-out infinite}
@keyframes timerPulse{50%{opacity:.5}}
/* 模擬試験の合格判定バンド */
.passband{width:100%;text-align:center;border-radius:16px;padding:12px;font-size:14px;font-weight:bold}
.passband.pass{color:#fff;background:linear-gradient(135deg,#FF8FB1,#E85A8A);box-shadow:0 4px 14px rgba(232,90,138,.35)}
.passband.miss{color:#2E63C9;background:rgba(143,177,255,.18);border:2px dashed rgba(46,99,201,.4)}
/* 視差・点滅がにがてな人には静かに表示 */
@media (prefers-reduced-motion:reduce){

}

const VISIBLE_COURSES=COURSES.filter(c=>!c.hidden);

let QUESTIONS=[],GLOSSARY=[];
let courseId="sg";

function curCourse(){ return COURSES.find(c=>c.id===courseId)||COURSES[0]; }
function dojoCourses(){ return COURSES.filter(c=>(c.dojo||"shia")===currentDojo && !c.hidden); }

let courseState="loading"; // loading | ready | error
window.registerCourse=function(d){ courseCache[d.id]=d; };
function applyCourse(d){
  QUESTIONS=d.questions; GLOSSARY=d.glossary;
  CATS=[...new Set(QUESTIONS.map(q=>q.category))];
  CAT_ICONS=CATS.map(c=>(d.catIcons&&d.catIcons[c])||"📚");
  cd={order:null,idx:0,flip:false};
  courseState="ready";
}
function loadCourse(id,done){
  if(courseCache[id]){ applyCourse(courseCache[id]); if(done)done(); render(); return; }
  courseState="loading"; render();
  const s=document.createElement("script");
  s.src="data/"+id+".js";
  s.onload=function(){
    if(courseCache[id]){ applyCourse(courseCache[id]); if(done)done(); }
    else{ courseState="error"; }
    render();
  };
  s.onerror=function(){ courseState="error"; render(); };
  document.head.appendChild(s);
}

  if(id===courseId&&courseState==="ready"){ go("home"); return; }
  courseId=id; try{ localStorage.setItem("shia_course",id); }catch(e){}

};

function setPremium(on){

let storePrice = "";

// iOS/iPadOSのネイティブアプリとして動いているか（ブラウザプレビューとの判別）
function isNativeApp(){
  try{ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
  catch(e){ return false; }
}
let iapReady=false; // 商品情報の読み込みが完了したか
document.addEventListener("deviceready", function(){
  try{
    const CP = window.CdvPurchase; if(!CP) return;
    const store = CP.store;
    store.register([{ id: PRODUCT_ID, type: CP.ProductType.NON_CONSUMABLE, platform: CP.Platform.APPLE_APPSTORE }]);
    store.when()
      .approved(function(tr){ tr.verify(); })
      .verified(function(receipt){ receipt.finish(); setPremium(true); });

      if(p && p.pricing){ storePrice = p.pricing.price; iapReady = true; }

    const store = window.CdvPurchase.store;
    const p = store.get(PRODUCT_ID);
    return (p && p.getOffer) ? p.getOffer() : null;
  }catch(e){ return null; }
}
window.buyPremium = function(){
  if(!window.CdvPurchase){
    if(isNativeApp()){
      showAlert("購入機能を準備しています。しばらくしてからもう一度お試しください。");
      return;

    // ブラウザプレビュー時のみ：動作確認用のお試し切替
    askConfirm("ここはプレビュー（ブラウザ）版です。\n動作確認用にプレミアムを有効にしますか？\n※iOSアプリ版ではApp Storeでの購入になります").then(function(ok){ if(ok) setPremium(true); });
    return;
  }
  const offer = getPremiumOffer();
  if(offer){
    try{
      const r = offer.order();
      if(r && r.then) r.then(function(err){ /* キャンセル等はAppleのダイアログ側で伝わる */ });
    }catch(e){
      showAlert("購入を開始できませんでした。通信環境をご確認のうえ、もう一度お試しください。");
    }
    return;
  }
  // 商品情報がまだ取得できていない → 再取得を試みつつ、ユーザーには待ってもらう
  try{ window.CdvPurchase.store.update(); }catch(e){}
  showAlert("商品情報を読み込んでいます。通信環境をご確認のうえ、少し待ってからもう一度お試しください。");
};
window.restorePurchase = function(){
  if(!window.CdvPurchase){
    if(isNativeApp()){
      showAlert("購入機能を準備しています。しばらくしてからもう一度お試しください。");
      return;
    }
    askConfirm("プレビュー版のため、動作確認用の切替になります。\nプレミアムを無効（無料プラン）に戻しますか？").then(function(ok){ if(ok) setPremium(false); });
    return;
  }
  // 復元は「押しても無反応」に見えないよう、必ず結果を知らせる
  let told=false;
  function tellResult(){
    if(told) return; told=true;
    showAlert(premium
      ? "購入を復元しました。プレミアムが使えるよ！"
      : "復元できる購入が見つかりませんでした。購入したときと同じApple IDでサインインしているかご確認ください。");
  }
  try{
    const r = window.CdvPurchase.store.restorePurchases();
    if(r && r.then) r.then(function(){ setTimeout(tellResult,800); }, function(){ setTimeout(tellResult,800); });
    else setTimeout(tellResult,2500);
  }

// ---------- アプリ内ダイアログ（OSの alert / confirm / prompt の代替） ----------
// iOSアプリ版のWebViewでは OS のダイアログが出ないことがあり、「試験を終了する」などが
// 押しても無反応に見える不具合の原因になっていた。すべてこの画面内ダイアログで行う。
function appDialog(o){
  return new Promise(function(resolve){
    const box=document.getElementById("appdlg"); if(!box){ resolve(o.input?null:false); return; }
    const title=document.getElementById("appdlg-title"), msg=document.getElementById("appdlg-msg");
    const inp=document.getElementById("appdlg-input"), btns=document.getElementById("appdlg-btns");
    title.textContent=o.title||""; title.style.display=o.title?"":"none";
    msg.textContent=o.msg||"";
    inp.style.display=o.input?"":"none";
    if(o.input){ inp.value=o.value||""; inp.maxLength=o.maxlen||64; inp.placeholder=o.placeholder||""; }
    btns.innerHTML="";
    let done=false;
    function close(v){ if(done) return; done=true; box.classList.remove("show"); document.removeEventListener("keydown",onKey); resolve(v); }
    function onKey(e){ if(e.key==="Escape") close(o.input?null:false); if(e.key==="Enter"&&o.input) close(inp.value); }
    if(o.cancel){ const c=document.createElement("button"); c.className="dlg-cancel"; c.textContent=o.cancel; c.onclick=function(){ close(o.input?null:false); }; btns.appendChild(c); }
    const k=document.createElement("button"); k.className="dlg-ok"+(o.danger?" danger":""); k.textContent=o.ok||"OK";
    k.onclick=function(){ close(o.input?inp.value:true); }; btns.appendChild(k);
    box.onclick=function(e){ if(e.target===box && o.cancel) close(o.input?null:false); };
    document.addEventListener("keydown",onKey);
    box.classList.add("show");
    setTimeout(function(){ try{ (o.input?inp:k).focus(); }catch(e){} },30);
  });
}
window.showAlert=function(m,title){ return appDialog({msg:m,title:title,ok:"OK"}); };
window.askConfirm=function(m,o){ o=o||{}; return appDialog({msg:m,title:o.title,ok:o.ok||"はい",cancel:o.cancel||"キャンセル",danger:o.danger}).then(function(r){ return r===true; }); };
window.askPrompt=function(m,cur,o){ o=o||{}; return appDialog({msg:m,title:o.title,input:true,value:cur,maxlen:o.maxlen,placeholder:o.placeholder,ok:o.ok||"決定",cancel:"キャンセル"}); };

function record(id, ok){
  try{
    todayBump("q");
    const h=loadH(); const s=h[id]||{correct:0,wrong:0,lastWrong:false,streak:0,due:0};
    if(ok){
      addXP(s.lastWrong ? XP.review : XP.correct); // まちがえた問題の解き直しは手厚く
      s.correct++; s.lastWrong=false; s.streak=(s.streak||0)+1;
      s.due=Date.now()+SRS_DAYS[Math.min(s.streak-1,SRS_DAYS.length-1)]*86400000;
    }else{
      s.wrong++; s.lastWrong=true; s.streak=0;
      s.due=Date.now(); // まちがえた問題はすぐ復習対象に
    }
    h[id]=s; localStorage.setItem(KEYH(),JSON.stringify(h));
  }catch(e){/* 保存できない環境でも学習自体は続けられるようにする */}
}

// XP・レベルは端末内のみに保存し、外部へ送信しない（「データ収集なし」を維持）
const LV_KEY = "shia_level_v1";
const XP = { correct:10, review:15, songFirst:20, songAgain:5, examMini:30, examFull:100 };
// 次のレベルに必要なXP。序盤は数問で上がり、Lv10以降は緩やかに増える（上限なし）
function needXP(lv){ return lv < 10 ? 30 + 10*(lv-1) : 120 + 25*(lv-10); }
function loadLv(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(LV_KEY)||"null"); }catch(e){}
  if(!d || typeof d.xp !== "number"){
    // 初回のみ：これまでの累計正解を引き継ぐ（既存ユーザーがLv1に戻らないように）
    let past = 0;
    try{
      COURSES.forEach(function(c){
        const h = JSON.parse(localStorage.getItem(courseHistKey(c.id))||"{}");
        Object.keys(h).forEach(function(k){ past += (h[k].correct||0); });
      });
    }catch(e){}
    d = { xp: past * XP.correct, seenSongs: [] };
    try{ localStorage.setItem(LV_KEY, JSON.stringify(d)); }catch(e){}
  }
  if(!Array.isArray(d.seenSongs)) d.seenSongs = [];
  return d;
}
function saveLv(d){ try{ localStorage.setItem(LV_KEY, JSON.stringify(d)); }catch(e){} }
// 累計XPから「レベル・そのレベル内での進捗・次までの必要量」を求める
function lvInfo(xp){
  let lv = 1, rest = xp;
  while(rest >= needXP(lv)){ rest -= needXP(lv); lv++; }
  return { lv, inLv: rest, need: needXP(lv), rate: Math.round(rest / needXP(lv) * 100) };
}

function touchStreak(){
  try{
    const today=ymd(new Date());
    const st=JSON.parse(localStorage.getItem(STREAK_KEY)||"{}");
    if(st.last===today) return;
    const y=new Date(); y.setDate(y.getDate()-1);
    st.days = (st.last===ymd(y)) ? (st.days||0)+1 : 1;
    st.best = Math.max(st.best||0, st.days);
    st.last = today;
    localStorage.setItem(STREAK_KEY, JSON.stringify(st));
  }catch(e){}
}
function streakInfo(){
  try{
    const st=JSON.parse(localStorage.getItem(STREAK_KEY)||"{}");
    if(!st.last) return {days:0,best:st.best||0};
    const today=ymd(new Date()); const y=new Date(); y.setDate(y.getDate()-1);
    if(st.last===today||st.last===ymd(y)) return {days:st.days||0,best:st.best||0};
    return {days:0,best:st.best||0}; // 途切れた
  }catch(e){ return {days:0,best:0}; }
}
// XPを加算し、レベルが上がったら演出用に記録する
function addXP(amount){
  if(!amount) return;
  touchStreak();
  bumpWeekXP(amount);
  const d = loadLv();
  const before = lvInfo(d.xp).lv;
  d.xp += amount;
  saveLv(d);
  const after = lvInfo(d.xp).lv;
  if(after > before) lvupPending = after;
}

function weekKey(){
  const d=new Date(); const off=(d.getDay()+6)%7;
  d.setDate(d.getDate()-off);
  return ymd(d);
}

function bumpWeekXP(amount){
  try{
    const w=loadWeeks(); const k=weekKey();
    w[k]=(w[k]||0)+amount;
    const keys=Object.keys(w).sort();
    while(keys.length>60){ delete w[keys.shift()]; } // 古い週は間引く
    localStorage.setItem(WEEK_KEY,JSON.stringify(w));
  }catch(e){}
}

function markSongHeard(id){
  todayBump("song");
  const d = loadLv();
  const first = d.seenSongs.indexOf(id) < 0;
  if(first) d.seenSongs.push(id);
  saveLv(d);
  // 再生速度に反比例してXPが変わる（2倍速=1/2、10倍速=1/10、0.7倍速なら約1.4倍のボーナス）

function lyricsFollow(){
  const el=audioEl; if(!el) return;
  const s=currentSongId?songById(currentSongId):null;
  const box=document.getElementById("lyrics");
  if(!s||!s.sync||!box||view.name!=="song"||view.arg!==s.id) return;
  // 鳴っている曲が画面の曲と一致するまでは追従しない（前の曲の再生位置で、別の曲の歌詞が光って進むのを防ぐ）
  if(playingSongId()!==s.id){ if(lyrLastIdx!==-2){ lyrLastIdx=-2; box.querySelectorAll(".lyr-line").forEach(function(p){ p.classList.remove("on","done"); }); } return; }
  const t=el.currentTime+0.2; // 少しだけ先読みして、歌い出しと同時に光らせる
  let idx=-1; for(let i=0;i<s.sync.length;i++){ if(s.sync[i]<=t) idx=i; else break; }
  if(idx===lyrLastIdx) return;
  lyrLastIdx=idx;
  const lines=box.querySelectorAll(".lyr-line");
  lines.forEach(function(p,i){ p.classList.toggle("on",i===idx); p.classList.toggle("done",i<idx); });
  // 自分でスクロールした直後（4秒）は追従を止めて、読みたい場所を邪魔しない
  if(idx>=0 && lines[idx] && Date.now()-lyrUserScrollAt>4000){ lyrAutoUntil=Date.now()+400; try{ lines[idx].scrollIntoView({block:"center",behavior:"auto"}); }catch(e){} }

function startChime(){

function mdToday(){ const t=new Date(); return String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }

function bdayLabel(id){ const b=BDAY[id]; return b? (+b.slice(0,2))+"月"+(+b.slice(3))+"日" : ""; }

function dailyLine(){
  const id=currentDojo, D=DAILY[id]||DAILY.shia;
  const h=new Date().getHours(), st=streakInfo().days;
  const dte=getExamDate()?daysToExam():null;
  const doy=Math.floor(Date.now()/86400000);
  let pool;
  if(isBday(id)) pool=D.bday;
  else if(dte!==null&&dte>=0&&dte<=7) pool=D.examSoon;
  else if(st>=3&&doy%3===0) pool=D.streak;
  else if(h<10) pool=D.morning;
  else if(h>=21) pool=D.night;
  else pool=D.general;
  return pool[doy%pool.length].replace("{n}", nickTag());
}

// 図表の拡大表示（小さい図を大きく見たいときのために、タップで全画面にする）
// 拡大率1＝図全体が画面幅にぴったり収まる。ピンチ・ダブルタップ・±ボタンで拡大し、指でスクロールして見る
let figScale = 1, figFitW = 320;
function figFitWidth(){ return Math.max(200, window.innerWidth - 48); } // 左右の余白（12px）と図のパディング（12px）ぶんを引く
window.openFig = function(el){
  const svg = el.querySelector("svg");
  if(!svg) return;
  const box = document.getElementById("figview-inner");
  box.innerHTML = svg.outerHTML;
  figFitW = figFitWidth();
  figScale = 1;
  applyFigScale();
  const v = document.getElementById("figview");
  v.classList.add("show");
  v.scrollTop = 0; v.scrollLeft = 0;
  figBindGestures();
};
window.closeFig = function(ev){
  if(ev && ev.target && ev.target.closest(".figinner")) return; // 図そのものをタップしたときは閉じない
  document.getElementById("figview").classList.remove("show");
};
window.zoomFig = function(dir){ setFigScale(figScale + dir * 0.6); };
// 拡大率を変えても、いま見ている中心が動かないようにスクロール位置を補正する
function setFigScale(next, cx, cy){
  const v = document.getElementById("figview");
  const prev = figScale;
  figScale = Math.min(6, Math.max(1, next));
  if(figScale === prev) return;
  const px = (cx==null? v.clientWidth/2 : cx), py = (cy==null? v.clientHeight/2 : cy);
  const ratio = figScale / prev;
  const ox = v.scrollLeft + px, oy = v.scrollTop + py;
  applyFigScale();
  v.scrollLeft = ox * ratio - px;
  v.scrollTop = oy * ratio - py;
}
function applyFigScale(){
  const svg = document.querySelector("#figview-inner svg");
  if(svg) svg.style.width = Math.round(figFitW * figScale) + "px";
}
// ピンチ（2本指）とダブルタップ。1本指のスクロールはブラウザ標準に任せる
let figGesturesBound = false;
function figBindGestures(){
  if(figGesturesBound) return;
  figGesturesBound = true;
  const v = document.getElementById("figview");
  let pinchD = 0, pinchScale = 1, pinchCx = 0, pinchCy = 0, lastTap = 0;
  v.addEventListener("touchstart", function(e){
    if(e.touches.length === 2){
      pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      pinchScale = figScale;
      pinchCx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      pinchCy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    } else if(e.touches.length === 1){
      const now = Date.now();
      if(now - lastTap < 320){ // ダブルタップ: 等倍⇄2.5倍
        setFigScale(figScale > 1.05 ? 1 : 2.5, e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
      }
      lastTap = now;
    }
  }, {passive:false});
  v.addEventListener("touchmove", function(e){
    if(e.touches.length === 2 && pinchD > 0){
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      setFigScale(pinchScale * (d / pinchD), pinchCx, pinchCy);
      e.preventDefault();
    }
  }, {passive:false});
  v.addEventListener("touchend", function(e){ if(e.touches.length < 2) pinchD = 0; });
  window.addEventListener("resize", function(){ if(v.classList.contains("show")){ figFitW = figFitWidth(); applyFigScale(); } });
}

// 歌詞中の英字（略語・英単語＝セキュリティ用語）を太字にする
function lyricHTML(line, terms){
  if(currentDojo!=="shia") return esc(line); // レナの歌詞は強調なし（英字だけ赤くなるのを回避）
  // かな行編: 曲ごとの用語リスト（長い語から照合）だけを赤くする。A〜Z編: 英字の語を赤くする
  if(terms && terms.length){
    const esced = terms.map(function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); });
    const re = new RegExp("(" + esced.join("|") + ")", "g");
    return esc(line).replace(re, "<b>$1</b>");
  }
  return esc(line).replace(/[A-Za-z][A-Za-z0-9\/\.\-']*/g, function(w){ return "<b>" + w + "</b>"; });
}

// 出力先の状態: "hp"=イヤホン系 / "spk"=本体スピーカー / null=不明（ブラウザ等）
// ネイティブ側（ShiaAudio）がイヤホンの抜き差しのたびにファイルへ書き、こちらが読む
let audioRoute=null;
let ringerState=null; // "ring" | "silent" | null(ブラウザ等・判定不能)
function silencedByManner(){
  // マナーモード安心設計: マナー中・イヤホンなし → 音を出さない
  if(audioRoute==="hp") return false;               // イヤホン中は常にOK
  if(ringerState==="silent") return true;           // マナー中は鳴らさない
  if(ringerState===null && isNativeApp()) return true; // 状態が届く前は安全側（起動直後の数秒）
  return false;
}
function refreshRoute(){
  try{
    const FS=fsPlugin(); if(!FS) return;
    // 背面（画面オフ・他アプリ）にいる間は状態を取り込まない。
    // 背面ではマナースイッチの検知が正しく働かず「マナー中」と誤判定して曲を止めることがあった。
    // 前面に戻った瞬間（visibilitychange）に改めて読み直す
    if(document.visibilityState==="hidden") return;
    FS.readFile({path:"shia_route.txt",directory:"DATA",encoding:"utf8"})
      .then(function(r){
        const prev=audioRoute;
        audioRoute=(r&&r.data&&String(r.data).indexOf("hp")>=0)?"hp":"spk";
        // マナーモード中にイヤホンが抜けたら、安心設計に従いその場で止める
        if(audioRoute==="spk" && prev!=="spk" && silencedByManner()){ try{ bgmAudioStop(); bgmStop(); }catch(e){} } // 覚え歌は止めない
        void prev;
      }).catch(function(){});
    FS.readFile({path:"shia_ringer.txt",directory:"DATA",encoding:"utf8"})
      .then(function(r){
        ringerState=(r&&r.data&&String(r.data).indexOf("silent")>=0)?"silent":"ring";
        // マナーに切り替わった瞬間、鳴っている音をその場で止める（外出先の安心設計）
        if(silencedByManner()){
          try{ bgmAudioStop(); bgmStop(); }catch(e){} // BGMだけ止める。覚え歌は再生を続ける
        }else{
          try{ bgmUpdate(); }catch(e){} // マナー解除でBGMを自然に復帰
        }
      }).catch(function(){});
  }catch(e){}
}
setInterval(refreshRoute, 2500);

// ---------- モード別BGM（オルゴール風・生成音なのでファイル不要） ----------
// ホーム系=かわいいワルツ / 学習系=落ち着いたメロディ。
// 本番CBT模試・覚え歌の再生中・バックグラウンドでは自動で止まる。
// シカクイロ代表曲「シカクイロ ― 未来に色を ―」のアレンジ対応表。
// 音源が届いたらハッシュを入れるだけで、その画面のBGMがテーマ曲アレンジに切り替わる。
//   title  = 原曲（タイトル・アイドル選択）※導入済み
//   menu   = 明るいインスト版（ホーム・道場）
//   study  = Lo-fi Study Mix（学習・演習）
//   exam   = Challenge Mix（模試）
//   result = ピアノ／オルゴール版（結果画面）
//   jingle = サビのVictory Jingle（正解・合格・レベルアップ）
const THEME_TRACKS={
  title:"dca9e264a9afcd96.m4a",
  menu:null, study:null, exam:null, result:null, jingle:null,
};
let bgmAudio=null, bgmAudioTrack=null;
function getBgmAudio(){
  if(bgmAudio) return bgmAudio;
  bgmAudio=document.createElement("audio");
  bgmAudio.id="bgm-audio";
  bgmAudio.loop=true;
  bgmAudio.crossOrigin="anonymous"; // 配信元はCORS対応（GitHub Pages）。Web Audioで音量制御するため必須
  bgmAudio.setAttribute("preload","none");
  bgmAudio.style.display="none";
  document.body.appendChild(bgmAudio);
  musicGraphAttach(bgmAudio,"theme");
  return bgmAudio;
}
function bgmAudioPlay(key){
  const f=THEME_TRACKS[key]; if(!f) return false;
  const el=getBgmAudio();
  if(bgmAudioTrack!==key){ el.src=SONGS_BASE_URL+f; bgmAudioTrack=key; }
  el.loop=true;
  applyThemeVol();
  musicCtxResume();
  if(el.paused){ const p=el.play(); if(p&&p.catch) p.catch(function(){}); }
  return true;
}
function bgmAudioStop(){
  try{ if(bgmAudio && !bgmAudio.paused) bgmAudio.pause(); }catch(e){}
}
// テーマ曲を流す画面か（タイトル・アイドル選択。覚え歌が再生中なら流さない）
function themeDesired(){
  if(!prefs.theme || !audioAllowed()) return null;
  if(document.visibilityState!=="visible") return null;
  try{ if(audioEl && !audioEl.paused && !audioEl.ended) return null; }catch(e){}

  const onSel=sel && sel.classList.contains("show");

}
const BGM_TRACKS={
  home:{step:210,vol:0.045,wave:"triangle",notes:[
    0,4,7,12,7,4, 2,5,9,14,9,5, 4,7,12,16,12,7, 2,5,9,14,9,5,
    0,4,7,12,7,4, -3,0,5,9,5,0, -1,2,7,11,7,2, 0,4,7,12,16,12]},
  study:{step:340,vol:0.035,wave:"sine",notes:[
    9,null,12,null,16,null,14,null, 12,null,9,null,7,null,null,null,
    5,null,9,null,12,null,11,null, 9,null,7,null,4,null,null,null]},
};
let bgmTimer=null, bgmStep=0, bgmNext=0, bgmTrack=null, bgmCtxRef=null;
function bgmDesired(){
  if(!prefs.bgm || !audioAllowed()) return null;
  if(document.visibilityState!=="visible") return null;
  try{ const a=getAudioEl(); if(a && !a.paused && !a.ended) return null; }catch(e){} // 覚え歌が最優先
  const t=document.getElementById("title");
  if(t && !t.classList.contains("hide") && t.style.display!=="none") return "home"; // タイトル画面
  if(qz && qz.exam && !qz.finished && view.name==="quiz") return null; // 本番CBT中は無音（試験会場と同じ緊張感）
  if(view.name==="quiz"||view.name==="flash"||view.name==="cards"||view.name==="review") return "study";
  if(view.name==="song") return null; // 曲画面ではBGMを流さない（再生の邪魔をしない）
  return "home";
}
function bgmStop(){
  if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; }
  bgmTrack=null;
}
function bgmStart(name){
  bgmStop();
  try{
    if(!tapCtx) tapCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(tapCtx.state==="suspended") tapCtx.resume();
    bgmCtxRef=tapCtx; bgmTrack=name; bgmStep=0; bgmNext=tapCtx.currentTime+0.1;
    bgmTimer=setInterval(function(){
      const tr=BGM_TRACKS[bgmTrack]; if(!tr){ bgmStop(); return; }
      const ctx=bgmCtxRef;
      while(bgmNext < ctx.currentTime + 0.35){
        const st=tr.notes[bgmStep % tr.notes.length];
        if(st!==null){
          const f=523.25*Math.pow(2,st/12);
          const o=ctx.createOscillator(), g=ctx.createGain();
          o.type=tr.wave; o.frequency.value=f;
          g.gain.setValueAtTime(0,bgmNext);
          g.gain.linearRampToValueAtTime(Math.max(0.0008,tr.vol*volBgm()),bgmNext+0.015);
          g.gain.exponentialRampToValueAtTime(0.0005,bgmNext+tr.step/1000*2.6);
          o.connect(g); g.connect(ctx.destination);
          o.start(bgmNext); o.stop(bgmNext+tr.step/1000*2.8);
        }
        bgmStep++; bgmNext+=tr.step/1000;
      }
    },120);
  }catch(e){}
}
// いまの画面・状態に合わせてBGMを付け替える（render後などに呼ばれる）
function bgmUpdate(){
  // シカクイロのテーマ曲が優先される画面（タイトル・アイドル選択）
  const th=themeDesired();
  if(th && bgmAudioPlay(th)){ bgmStop(); return; }
  bgmAudioStop();
  const want=bgmDesired();
  if(want===bgmTrack) return;
  if(want===null) bgmStop(); else bgmStart(want);
}
document.addEventListener("visibilitychange",function(){
  bgmUpdate();
  // 背面に回ったらBGM(テーマ曲・オルゴール)とWebAudioを完全に止める。
  // 生かして背面に持ち込むのは覚え歌(常駐audio要素)だけ。
  // WebAudioが動いたままだと、iOSが覚え歌まで巻き込んで止めてしまうため
  try{
    if(document.visibilityState==="hidden"){
      bgmAudioStop(); bgmStop();
      if(tapCtx && tapCtx.state==="running") tapCtx.suspend();
      // 覚え歌の音声はWeb Audioグラフ経由のため、再生中はコンテキストを起こしたまま背面へ
      if(audioEl && !audioEl.paused) musicCtxResume();
    }else{
      musicCtxResume(); // 前面復帰時にも念のため再開（iOSに止められた場合の復旧）
    }
  }catch(e){}
});

let tapCtx=null;
function tapSound(){
  if(!prefs.tap || !audioAllowed()) return;
  try{
    if(!tapCtx) tapCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(tapCtx.state==="suspended") tapCtx.resume();
    const o=tapCtx.createOscillator(), g=tapCtx.createGain();
    o.type="sine"; o.frequency.setValueAtTime(880,tapCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(660,tapCtx.currentTime+0.07);
    g.gain.setValueAtTime(Math.max(0.001,0.10*volSfx()),tapCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,tapCtx.currentTime+0.09);
    o.connect(g); g.connect(tapCtx.destination);
    o.start(); o.stop(tapCtx.currentTime+0.1);
  }catch(e){}
}

let qz=null;
function startQuiz(pool,title,limit,backTo){
  let qs=shuffle(pool); if(limit) qs=qs.slice(0,limit);
  qz={qs,title,idx:0,picked:null,correct:0,finished:false,backTo:backTo||"category"};
  go("quiz");
}
window.pick=function(i){
  if(qz.exam && !qz.graded){ qz.answers[qz.idx]=i; render(); return; } // 本番形式: 選び直し可・判定は採点時
  if(qz.picked!==null) return;
  qz.picked=i;
  const q=qz.qs[qz.idx];
  const ok = i===q.answer;
  if(ok) qz.correct++;
  record(q.id, ok);
  render();
  if(ok) praise();
  playSfx(ok?"correct":"wrong", ok?"せいかい！":"ざんねん！", null);
};
window.nextQ=function(){
  if(qz.idx+1>=qz.qs.length){
    qz.finished=true;
    if(qz.exam) saveExamResult();
    render();
    playSfx("finish","おつかれさま！",null);
  } else {
    qz.idx++; qz.picked=null; render();
  }
};
// 問題本文の描画（v1.3拡張: scenario=長文の状況設定 / figure=図表SVG / source=出典表記）
// figure はアプリ同梱の自作SVGのみ（外部入力は入らない）。source は必ず表示する（IPA利用条件）
function qBody(q){
  let h="";
  if(q.scenario) h+=`<div class="scenario">${esc(q.scenario)}</div>`;
  if(q.figure) h+=`<div class="qfigure" onclick="openFig(this)"><span class="figzoom-hint">🔍 タップで拡大</span>${q.figure}</div>`;
  h+=`<p style="font-size:15px;font-weight:bold;line-height:1.8">${esc(q.question)}</p>`;
  if(q.source) h+=`<p class="qsource">${esc(q.source)}</p>`;
  return h;
}
function quizView(){
  if(!qz) return homeView();
  if(qz.qs.length===0){
    return `<div class="center" style="padding:40px 0">${shia("happy",96)}
      <p style="font-size:14px;color:rgba(47,59,92,.7)">出題できる問題がないよ！<br>ぜんぶ正解できてるってこと。すごい！</p>
      <button class="btn" style="width:auto;padding:14px 32px" onclick="go('category')">分野別学習へ</button></div>`;
  }
  if(qz.finished){
    const rate=Math.round(qz.correct/qz.qs.length*100);
    const msg = rate===100 ? "全問正解！本当にすごいよ、この分野はもうばっちりだね！"
      : rate>=70 ? "合格ライン超え！間違えた問題は「復習」からもう一回やってみよ？"
      : "間違えたところは伸びしろだよ。「復習」タブで一緒におさらいしよ！";

    return `<div class="center" style="padding:20px 0"><img class="shiapop shia-happy" src="${poseImg}" width="140" alt="${poseName}" style="border-radius:14px">

      <div class="card" style="width:100%;text-align:center">

        <p style="font-size:34px;font-weight:bold;color:#E85A8A">${qz.correct}<span style="font-size:16px;color:rgba(47,59,92,.5)"> / ${qz.qs.length} 問正解</span></p>
        <div class="progressbar" style="margin-top:10px"><i style="width:${rate}%"></i></div>
        <p style="margin-top:8px;font-size:13px;font-weight:bold;color:rgba(47,59,92,.7)">正答率 ${rate}%</p>
      </div>
      ${qz.exam?(rate>=60
        ?`<div class="passband pass">🌸 合格ライン突破！本番もこの調子だよ！</div><p class="small" style="text-align:center;margin-top:6px"><a class="link" href="javascript:void(0)" onclick="go('collection')">🥈 コレクションの資格バッジが銀になったよ →</a></p>`
        :`<div class="passband miss">合格ライン（60%）まであと${60-rate}%。のびしろしかない！</div>`):""}
      ${qz.exam&&qz.graded&&curCourse().examQuota?examSubjectBreakdown():""}
      ${qz.timeout?`<p class="small" style="font-weight:bold;color:#F1607A">⏰ 制限時間切れで終了したよ。時間配分も本番の練習！</p>`:""}
      ${qz.exam?examDelta(rate):""}
      ${qz.graded?`<button class="btn ghost" style="width:100%" onclick="reviewExam()">📖 解答と解説を確認する（本番画面のまま見直せるよ）</button>`:""}
      ${bubble(rate>=70?"cheer":"normal",msg)}
      <div class="row" style="width:100%">
        <button class="btn ghost" onclick="go('review')">復習する</button>
        <button class="btn" onclick="go('category')">他の分野へ</button>
      </div></div>`;
  }
  if(qz.exam) return examQuestionView();

  const d=DIFF[q.difficulty]||DIFF.normal;
  let html=`<h1 style="font-size:17px">✏️ ${esc(qz.title)}</h1>
    <div style="display:flex;align-items:center;gap:10px;margin:12px 0">
      <div class="progressbar"><i style="width:${(qz.idx+(done?1:0))/qz.qs.length*100}%"></i></div>

      ${qBody(q)}</div>

      <p class="small" style="font-weight:bold">${nickTag()}${CHEERS[qz.idx%CHEERS.length]}</p></div>`;

  if(done){
    const lead = ok?PRAISE[qz.idx%PRAISE.length]:COMFORT[qz.idx%COMFORT.length];
    html+=`<div class="gap" style="margin-top:14px">

  }
  return html;
}

    <div class="gap" style="margin-top:10px;gap:8px">`;

      else if(i===a){cls+=" wrong";tail='<span style="margin-left:auto">❌</span>'}
      else cls+=" dim";
    }
    html+=`<button class="${cls}" style="padding:11px 14px" ${done?"disabled":""} onclick="flPick(${i})">
      <span class="mark">${chLabel(q,i)}</span><span style="line-height:1.5">${esc(c)}</span>${tail}</button>`;
  });
  html+=`</div>`;
  if(!done){
    html+=`<div style="display:flex;align-items:center;gap:8px;margin-top:12px">${shia("normal",46)}
      <p class="small" style="font-weight:bold">${nickTag()}${CHEERS[fl.idx%CHEERS.length]}</p></div>`;
  }
  if(done){
    html+=`<div class="gap" style="margin-top:12px;gap:10px">

  }
  return html;
}

window.setVol=function(k,v){
  const f=Math.min(100,Math.max(0,parseInt(v,10)||0))/100;
  try{ localStorage.setItem("shia_vol_"+k,String(f)); }catch(e){}
  const lbl=document.getElementById("vol-"+k); if(lbl) lbl.textContent=Math.round(f*100)+"%";
  if(k==="song"){ applySongVol(audioEl); }
  if(k==="theme"){ applyThemeVol(); }
  if(k==="sfx"){ try{ tapSound(); }catch(e){} } // その場で試し聴き
};

// 本試験と同じく、問題番号から自由に移動・解答はいつでも選び直し可・
// 「後で見直すためにチェックする」・「試験を終了する」で一括採点。
function examQuestionView(){
  const n=qz.qs.length, q=qz.qs[qz.idx];
  const a=qz.answers[qz.idx];
  const answered=qz.answers.filter(function(x){return x!==null}).length;
  const g=qz.graded;
  const examName=(curCourse().exam||qz.title).replace(/（.*$/,"");
  let html=`<div class="cbt">
    <div class="cbt-head"><span>${esc(examName)}</span>
      ${!g&&qz.deadline?`<span class="tm" id="exam-timer">⏱ ${fmtLeft(qz.deadline-Date.now())}</span>`:`<span class="tm">見直しモード</span>`}</div>
    <div class="cbt-sub"><span>${CATS.includes("科目B対策")?(q.category==="科目B対策"?"科目B　":"科目A　"):""}問${qz.idx+1} ／ 全${n}問</span><span>${g?`正解 ${qz.correct}問`:`解答済み ${answered}問`}</span></div>
    <div class="qnav">${qz.qs.map(function(x,i){
      let cls=i===qz.idx?"cur ":"";
      if(g){ cls+=qz.answers[i]===x.answer?"ok":"ng"; }
      else { if(qz.answers[i]!==null) cls+="ans "; if(qz.flags[i]) cls+="flg"; }
      return `<button class="${cls}" onclick="qzJump(${i})">${i+1}</button>`;}).join("")}</div>
    <div class="cbt-q">${qBody(q)}
      ${q.choices.map(function(c,i){
        let cls="cbt-choice", tail="";
        if(g){
          if(i===q.answer){ cls+=" okc"; tail=`<span style="margin-left:auto;font-weight:bold;color:#1E7A5A">正解</span>`; }

// 本試験と同じ配分・配列で出題セットを作る
// 科目Bのあるコース: 科目A(8割・分野バランス配分)を前半、科目B(2割)を後半に並べる（本番のCBTと同じ順序）
function buildExamSet(total){
  const all=pool();
  const quota=curCourse().examQuota;
  if(quota && total===curCourse().examN){
    // 本番と同じ科目配分・科目順（例: 乙4は法令15→物化10→性消10）。科目内だけシャッフル
    let sel=[];
    Object.keys(quota).forEach(function(c){
      sel=sel.concat(shuffle(all.filter(function(q){return q.category===c})).slice(0,quota[c]));
    });
    if(sel.length<total){ // 在庫が足りない分野があれば他分野から補充（順序は保つ）
      const used=new Set(sel.map(function(q){return q.id}));
      sel=sel.concat(shuffle(all.filter(function(q){return !used.has(q.id)})).slice(0,total-sel.length));
    }
    return sel.slice(0,total);
  }
  const bPool=all.filter(function(q){return q.category==="科目B対策"});
  const aPool=all.filter(function(q){return q.category!=="科目B対策"});
  const bN=bPool.length?Math.min(bPool.length, Math.max(1, Math.round(total*0.2))):0; // SG本番: 60問中12問が科目B
  const aN=total-bN;
  // 科目Aは分野ごとに均等割りして、まんべんなく出題する
  const cats=[...new Set(aPool.map(function(q){return q.category}))];
  const per=Math.floor(aN/cats.length);
  let aSel=[];
  cats.forEach(function(c){ aSel=aSel.concat(shuffle(aPool.filter(function(q){return q.category===c})).slice(0,per)); });
  const used=new Set(aSel.map(function(q){return q.id}));
  aSel=aSel.concat(shuffle(aPool.filter(function(q){return !used.has(q.id)})).slice(0, aN-aSel.length));
  return shuffle(aSel).concat(shuffle(bPool).slice(0,bN));
}

function hintTokens(text){
  const out=[]; const re=/[ァ-ヶー]{3,}|[一-龠々]{2,}|[A-Za-z][A-Za-z0-9]{2,}/g; let m;
  while((m=re.exec(text))){ const w=m[0]; if(!/^(こと|もの|ため|とき|場合|次の|うち|どれ|正しい|誤り|適切|不適当|記述|関する|について|以下|以上|以内)$/.test(w)) out.push(w); }
  return [...new Set(out)];
}
function songHintFor(q){
  try{

    const toks=hintTokens((q.choices&&q.choices[q.answer]?q.choices[q.answer]+" ":"")+q.question).slice(0,24);
    if(!toks.length) return null;
    let best=null;
    for(const sg of list){
      let li=0;
      for(const b of sg.blocks){ for(const l of b.lines){ if(l===""){ continue; }
        let sc=0; for(const t of toks){ if(l.indexOf(t)>=0) sc+=(t.length>=4?2:1); }
        if(sc>best?.sc||(!best&&sc>0)) best={sc:sc,sg:sg,li:li,line:l};
        li++; } }
    }
    return best&&best.sc>=2?best:null;
  }catch(e){ return null; }
}

window.renderKeepFocus=function(){
  const pos=document.activeElement&&document.activeElement.selectionStart;
  render();
  const inp=document.querySelector("input.search");
  if(inp){inp.focus();if(pos!=null)inp.setSelectionRange(pos,pos)}
};

// 課金画面で「1曲あたり」を出す。価格はStoreKitの表示価格から数字だけを取り出して計算する
function perSongLabel(){
  try{
    const n = totalSongN(); if(!n || !storePrice) return "";
    const v = parseFloat(String(storePrice).replace(/[^0-9.]/g,"")); if(!(v>0)) return "";
    const per = v/n;
    return "1曲あたり約" + (per>=10 ? Math.round(per) : per.toFixed(1)) + "円";
  }catch(e){ return ""; }
}

function rankingView(){
  const nick=getNick();

  const rows=Object.entries(w).map(function(e){return{k:e[0],xp:e[1]}})
    .sort(function(a,b){return b.xp-a.xp}).slice(0,10);
  const myRank=rows.findIndex(function(r){return r.k===nowK})+1;
  const medal=["🥇","🥈","🥉"];
  return `<h1>🏆 ランキング</h1><div class="gap" style="margin-top:12px">
  <div class="card" style="text-align:center">
    <p class="small">挑戦者</p>
    ${nick?`<p style="font-size:22px;font-weight:900;color:#E85A8A">${esc(nick)} さん</p>`:`<p style="font-size:19px;font-weight:900;color:rgba(47,59,92,.45)">ニックネーム未設定</p>`}
    <button class="btn ghost" style="width:auto;padding:8px 20px;font-size:12px;margin-top:6px" onclick="setNick()">✏️ ニックネームを${nick?"変える":"つける"}</button></div>
  ${bubble("cheer",nick?esc(nick)+"さん、今週も一緒にがんばろ！自分超えが最強への近道だよ！":"まずはニックネームをつけてね！ランキングにのる名前だよ♪")}
  <div class="card"><p class="small">今週の獲得XP</p>
    <p><span class="lvnum">${nowXP}</span><span style="font-size:13px;font-weight:bold;color:rgba(47,59,92,.6)"> XP</span>
    ${myRank>0?`<span class="streak" style="margin-left:10px">歴代 ${myRank}位${myRank===1?"！自己ベスト更新中🎉":""}</span>`:""}</p></div>
  <div class="card"><p style="font-size:14px;font-weight:bold;margin-bottom:10px">📊 週間XP 自己ベスト TOP10</p>
    ${rows.length?rows.map(function(r,i){
      const cur=r.k===nowK;
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(142,124,195,.12);${cur?"background:rgba(232,90,138,.06);border-radius:8px":""}">
        <span style="flex:0 0 34px;font-size:${i<3?"20px":"13px"};font-weight:bold;text-align:center;color:#8E7CC3">${medal[i]||(i+1)+"位"}</span>
        <span style="flex:1;font-size:13px;font-weight:bold">${r.k}の週 ${cur?`<span style=\"color:#E85A8A\">← 今週</span>`:""}</span>
        <b style="color:#E85A8A">${r.xp} XP</b></div>`;}).join("")
    :`<p class="small" style="text-align:center;padding:12px 0">まだ記録がないよ。問題を解いたり歌を聴いたりするとXPがたまるよ！</p>`}</div>
  </div>`;
}

function render(){
  // 常駐プレイヤーが#app内にいる場合は退避してから描き直す（innerHTML更新で破壊されないように）
  if(audioEl && app.contains(audioEl)){ audioEl.style.display="none"; document.body.appendChild(audioEl); }
  if(courseState!=="ready"&&view.name!=="courses"){
    if(courseState==="error"){
      app.innerHTML=`<div class="center" style="padding:60px 0">${shia("oops",96)}
        <p style="font-size:14px;font-weight:bold">問題データを読み込めなかったよ…</p>
        <button class="btn" style="width:auto;padding:14px 32px" onclick="retryCourse()">もういちど読み込む</button>
        <button class="btn ghost" style="width:auto;padding:14px 32px" onclick="go('courses')">コースをえらびなおす</button></div>`;
    }else{
      app.innerHTML=`<div class="center" style="padding:80px 0">${shia("normal",96)}
        <p style="font-size:14px;font-weight:bold">じゅんびしてるよ…</p></div>`;
    }
    renderNav(); return;
  }
  app.innerHTML=(VIEWS[view.name]||homeView)();
  renderNav();
  // 模試中は制限時間タイマーを動かす
  if(view.name==="quiz"&&qz&&qz.exam&&!qz.finished&&qz.deadline) startExamTimer();
  else clearInterval(examTick);
  if(view.name==="song"){ initSongAudio(); syncPlayerUI(); }
  showLvUp(); // レベルが上がっていたら一言
  try{ bgmUpdate(); }catch(e){} // 画面に合わせてBGMを付け替え // 再生画面で開いた曲だけ読み込む（先読みしない）
}
// レベルアップ時に画面上部から一言（描画のたびに保留分をチェックする）
function showLvUp(){
  if(lvupPending===null) return;
  const el=document.getElementById("lvup"); if(!el) return;
  const n=lvupPending; lvupPending=null;
  document.getElementById("lvup-title").textContent="🎉 情報セキュリティLv." + n + " になった！";
  document.getElementById("lvup-msg").textContent=LVUP_WORDS[Math.floor(Math.random()*LVUP_WORDS.length)];
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
  clearTimeout(showLvUp._t);
  showLvUp._t=setTimeout(function(){ el.classList.remove("show"); },2800);
}
